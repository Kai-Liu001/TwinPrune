[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinprune"
version = "0.1.0rc1"
description = "Two-phase visual token pruning and phase-aware evaluation"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.0", "torchvision==0.22.0", "transformers==5.3.0",
    "accelerate==1.13.0", "timm==1.0.25", "einops==0.8.2",
    "numpy==2.4.2", "pandas==3.0.1", "pyarrow==23.0.1",
    "Pillow==12.1.1", "PyYAML==6.0.3", "tqdm==4.67.3",
    "openai==2.34.0", "httpx==0.28.1",
]

[project.optional-dependencies]
cuda = ["flash-attn==2.8.3", "ninja", "psutil", "packaging"]
lora = ["peft==0.18.1", "datasets==4.6.1", "safetensors"]

[project.scripts]
twinprune-eval = "twinprune.evaluate:main"
twinprune-verify = "twinprune.verify:main"

[tool.setuptools.packages.find]
include = ["twinprune*", "src*", "phase2*"]

[tool.setuptools.package-data]
twinprune = ["resources/*.json", "resources/reference_scores/*.gz"]
